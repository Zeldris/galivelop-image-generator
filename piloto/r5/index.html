s="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>tarkor</h2><div class="fila"><figure data-pieza="tarkor avatar"><a href="tarkor/intentos/avatar.png" target="_blank"><img src="tarkor/intentos/avatar.png" alt="tarkor avatar" loading="lazy"></a><figcaption><b>avatar</b>  <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="tarkor cabecera"><a href="tarkor/intentos/cabecera.png" target="_blank"><img src="tarkor/intentos/cabecera.png" alt="tarkor cabecera" loading="lazy"></a><figcaption><b>cabecera</b> contraste 11.39:1, peor 6.89:1 · paleta 73.33 % · YAVG 172.22 <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="tarkor cuadrado"><a href="tarkor/intentos/cuadrado.png" target="_blank"><img src="tarkor/intentos/cuadrado.png" alt="tarkor cuadrado" loading="lazy"></a><figcaption><b>cuadrado</b> contraste 6.28:1, peor 5.18:1 · paleta 84.35 % · YAVG 177.0 <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="tarkor bajo"><a href="tarkor/intentos/og-bajo.png" target="_blank"><img src="tarkor/intentos/og-bajo.png" alt="tarkor bajo" loading="lazy"></a><figcaption><b>og-bajo</b> contraste 9.5:1, peor 7.36:1 · paleta 50.52 % · YAVG 66.08 <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="tarkor vertical"><a href="tarkor/intentos/vertical.png" target="_blank"><img src="tarkor/intentos/vertical.png" alt="tarkor vertical" loading="lazy"></a><figcaption><b>vertical</b> contraste 7.22:1, peor 4.98:1 · paleta 69.21 % · YAVG 173.99 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>toveriai</h2><div class="fila"><figure data-pieza="toveriai avatar"><a href="toveriai/intentos/avatar.png" target="_blank"><img src="toveriai/intentos/avatar.png" alt="toveriai avatar" loading="lazy"></a><figcaption><b>avatar</b>  <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="toveriai cabecera"><a href="toveriai/intentos/cabecera.png" target="_blank"><img src="toveriai/intentos/cabecera.png" alt="toveriai cabecera" loading="lazy"></a><figcaption><b>cabecera</b> contraste 15.05:1, peor 14.83:1 · paleta 76.82 % · YAVG 196.4 <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="toveriai cuadrado"><a href="toveriai/intentos/cuadrado.png" target="_blank"><img src="toveriai/intentos/cuadrado.png" alt="toveriai cuadrado" loading="lazy"></a><figcaption><b>cuadrado</b> contraste 15.92:1, peor 15.6:1 · paleta 67.13 % · YAVG 188.0 <button class="si">sí</button><button class="no">no</button></figcaption></figure><figure data-pieza="toveriai vertical"><a href="toveriai/intentos/vertical.png" target="_blank"><img src="toveriai/intentos/vertical.png" alt="toveriai vertical" loading="lazy"></a><figcaption><b>vertical</b> contraste 15.19:1, peor 14.69:1 · paleta 75.23 % · YAVG 194.1 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>Veredicto</h2><textarea id="veredicto" readonly></textarea><p><button id="copiar">Copiar veredicto</button></p></section><script>
const R = document.body.dataset.ronda;
const clave = id => 'piloto:' + R + ':' + id;
function lee(id) { try { return localStorage.getItem(clave(id)) || ''; } catch (e) { return ''; } }
function pinta() {
  const lineas = [];
  document.querySelectorAll('[data-pieza]').forEach(f => {
    const v = lee(f.dataset.pieza);
    f.querySelector('.si').classList.toggle('on', v === 'sí');
    f.querySelector('.no').classList.toggle('on', v === 'no');
    if (v) lineas.push(f.dataset.pieza + ' ' + v);
  });
  document.getElementById('veredicto').value = R + ': ' + (lineas.join(', ') || '(sin marcar)');
}
document.querySelectorAll('[data-pieza]').forEach(f => f.querySelectorAll('button').forEach(b => b.onclick = () => {
  const v = b.classList.contains('si') ? 'sí' : 'no';
  try { localStorage.setItem(clave(f.dataset.pieza), lee(f.dataset.pieza) === v ? '' : v); } catch (e) {}
  pinta();
}));
document.getElementById('copiar').onclick = () => {
  const t = document.getElementById('veredicto'); t.select(); navigator.clipboard?.writeText(t.value);
};
pinta();
// Abierta como archivo desde un flatpak, el portal da solo el HTML y no las imágenes: avisa una vez.
addEventListener('error', e => {
  if (e.target.tagName !== 'IMG' || location.protocol !== 'file:' || document.getElementById('aviso')) return;
  const p = document.createElement('p'); p.id = 'aviso';
  p.textContent = 'Las imágenes no cargan abiertas como archivo (pasa con VS Code o el navegador en flatpak). '
    + 'Ábrelas con: python3 examples/pilot/ver.py';
  document.body.prepend(p);
}, true);
</script></body></html>
