<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Piloto r4</title><style>
:root { color-scheme: dark; --bg:#111318; --panel:#1b1e25; --texto:#e6e6e6; --tenue:#9aa0aa; --si:#2e9e5b; --no:#c0392b; }
body { margin:0; padding:16px; background:var(--bg); color:var(--texto); font:15px/1.5 system-ui, sans-serif; }
h1 { margin:0 0 4px; } a { color:#7cc4ff; }
section { background:var(--panel); border-radius:10px; padding:14px; margin:18px 0; }
.fila { display:flex; flex-wrap:wrap; gap:12px; }
figure { margin:0; flex:1 1 420px; max-width:640px; }
figure img { width:100%; border-radius:6px; display:block; cursor:zoom-in; }
figcaption { color:var(--tenue); font-size:13px; margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
details { color:var(--tenue); font-size:13px; margin-bottom:8px; } details p { white-space:pre-wrap; color:var(--texto); }
button { background:#2a2f3a; color:var(--texto); border:1px solid #3a404c; border-radius:6px; padding:2px 10px; cursor:pointer; }
button.si.on { background:var(--si); } button.no.on { background:var(--no); }
#aviso { background:#5a3a10; padding:8px 12px; border-radius:6px; }
textarea { width:100%; height:9em; background:var(--panel); color:var(--texto); border:1px solid #3a404c; border-radius:6px; }
</style><body data-ronda="r4"><p><a href="../index.html">← rondas</a></p><h1>Ronda r4</h1><p>Pincha una imagen para verla a tamaño real. Marca sí/no y pega el veredicto en el chat.</p><section><h2>galivelop-developer</h2><div class="fila"><figure data-pieza="galivelop-developer og"><a href="galivelop-developer/intentos/og.png" target="_blank"><img src="galivelop-developer/intentos/og.png" alt="galivelop-developer og" loading="lazy"></a><figcaption><b>og</b> contraste 14.56:1, peor 11.82:1 · paleta 85.7 % · YAVG 36.94 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>galivelop-image-generator</h2><div class="fila"><figure data-pieza="galivelop-image-generator og"><a href="galivelop-image-generator/intentos/og.png" target="_blank"><img src="galivelop-image-generator/intentos/og.png" alt="galivelop-image-generator og" loading="lazy"></a><figcaption><b>og</b> contraste 17.08:1, peor 16.49:1 · paleta 72.36 % · YAVG 47.9 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>galivelop-voice-generator</h2><div class="fila"><figure data-pieza="galivelop-voice-generator og"><a href="galivelop-voice-generator/intentos/og.png" target="_blank"><img src="galivelop-voice-generator/intentos/og.png" alt="galivelop-voice-generator og" loading="lazy"></a><figcaption><b>og</b> contraste 16.97:1, peor 16.34:1 · paleta 70.22 % · YAVG 52.6 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>galivelop-workflow</h2><div class="fila"><figure data-pieza="galivelop-workflow og"><a href="galivelop-workflow/intentos/og.png" target="_blank"><img src="galivelop-workflow/intentos/og.png" alt="galivelop-workflow og" loading="lazy"></a><figcaption><b>og</b> contraste 16.64:1, peor 15.86:1 · paleta 93.38 % · YAVG 43.02 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>portal</h2><div class="fila"><figure data-pieza="portal og"><a href="portal/intentos/og.png" target="_blank"><img src="portal/intentos/og.png" alt="portal og" loading="lazy"></a><figcaption><b>og</b> contraste 17.04:1, peor 15.78:1 · paleta 66.95 % · YAVG 64.85 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>tarkor</h2><div class="fila"><figure data-pieza="tarkor og"><a href="tarkor/intentos/og.png" target="_blank"><img src="tarkor/intentos/og.png" alt="tarkor og" loading="lazy"></a><figcaption><b>og</b> contraste 11.26:1, peor 6.97:1 · paleta 72.32 % · YAVG 168.91 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>toveriai</h2><div class="fila"><figure data-pieza="toveriai og"><a href="toveriai/intentos/og.png" target="_blank"><img src="toveriai/intentos/og.png" alt="toveriai og" loading="lazy"></a><figcaption><b>og</b> contraste 15.5:1, peor 15.0:1 · paleta 66.95 % · YAVG 186.52 <button class="si">sí</button><button class="no">no</button></figcaption></figure></div></section><section><h2>Veredicto</h2><textarea id="veredicto" readonly></textarea><p><button id="copiar">Copiar veredicto</button></p></section><script>
const R = document.body.dataset.ronda;
const clave = id => 'piloto:' + R + ':' + id;
function lee(id) { try { return localStorage.getItem(clave(id)) || ''; } catch (e) { return ''; } }
function pinta() {
  const lineas = [];
  document.querySelectorAll('[data-pieza]').forEach(f => {
    const v = lee(f.dataset.pieza);
    f.querySelector('.si').classList.toggle('on', v === 'sí');
    f.querySelector('.no').classList.toggle('on', v === 'no');
    if (v) lineas.push(f.dataset.pieza + ' ' + v);
  });
  document.getElementById('veredicto').value = R + ': ' + (lineas.join(', ') || '(sin marcar)');
}
document.querySelectorAll('[data-pieza]').forEach(f => f.querySelectorAll('button').forEach(b => b.onclick = () => {
  const v = b.classList.contains('si') ? 'sí' : 'no';
  try { localStorage.setItem(clave(f.dataset.pieza), lee(f.dataset.pieza) === v ? '' : v); } catch (e) {}
  pinta();
}));
document.getElementById('copiar').onclick = () => {
  const t = document.getElementById('veredicto'); t.select(); navigator.clipboard?.writeText(t.value);
};
pinta();
// Abierta como archivo desde un flatpak, el portal da solo el HTML y no las imágenes: avisa una vez.
addEventListener('error', e => {
  if (e.target.tagName !== 'IMG' || location.protocol !== 'file:' || document.getElementById('aviso')) return;
  const p = document.createElement('p'); p.id = 'aviso';
  p.textContent = 'Las imágenes no cargan abiertas como archivo (pasa con VS Code o el navegador en flatpak). '
    + 'Ábrelas con: python3 examples/pilot/ver.py';
  document.body.prepend(p);
}, true);
</script></body></html>
