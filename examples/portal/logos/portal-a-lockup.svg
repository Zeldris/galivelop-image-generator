<svg data-fondo="oscuro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" role="img" aria-labelledby="portal-a-lockup-t">
  <title id="portal-a-lockup-t">Galivelop</title>
  <!-- Lockup de portal-a: el símbolo y el nombre en Sora 700, tracking -0,03 em; «Gali» celeste, «velop» claro (variante sobre fondo oscuro, como la web). Al elegirse, el texto se pasa a trazos. -->
  <g id="portal-a-lockup-simbolo">
    <defs>
      <linearGradient id="portal-a-lockup-fondo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2BB3EA"/>
        <stop offset="1" stop-color="#0083C1"/>
      </linearGradient>
    </defs>
    <rect width="128" height="128" rx="30" fill="url(#portal-a-lockup-fondo)"/>
    <path d="M50 64 H66 A24 24 0 1 1 42 40 H72 L90 88 L108 40"
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="152" y="86" font-family="Sora, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.9" fill="#EAF4FA"><tspan fill="#1AA6DF">Gali</tspan>velop</text>
</svg>
