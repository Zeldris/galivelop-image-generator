<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="portal-c-t">
  <title id="portal-c-t">Galivelop — Luz y mar</title>
  <!-- c. Luz y mar: el bowl de la G es el arco de luz y el travesaño es una línea de ola que sale de la G y sigue como superficie del mar -->
  <defs>
    <linearGradient id="portal-c-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3EA"/>
      <stop offset="1" stop-color="#0083C1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#portal-c-fondo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M59.4 45.6 A24 24 0 1 0 68 64"/>
    <path d="M54 64 H66 C76 64 78 74 88 74 C98 74 100 58 108 58"/>
  </g>
</svg>
