<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="portal-d-t">
  <title id="portal-d-t">Galivelop — baldosa con g</title>
  <!-- d. Wordmark primero: el símbolo es la baldosa del punto de la «i» de «galivelop» con una «g» minúscula de un trazo -->
  <defs>
    <linearGradient id="portal-d-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3EA"/>
      <stop offset="1" stop-color="#0083C1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#portal-d-fondo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="52" r="20"/>
    <path d="M84 32 V76 C84 88 76 96 64 96 C56 96 50 92 48 86"/>
  </g>
</svg>
