<svg data-fondo="oscuro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 128" role="img" aria-labelledby="portal-d-lockup-t">
  <title id="portal-d-lockup-t">galivelop</title>
  <!-- Lockup de portal-d: el wordmark es la marca. «galivelop» en Sora 700 minúsculas con el punto de la «i» como baldosa celeste; «gal» y «velop» van con textLength para que la baldosa caiga en su sitio con cualquier fuente. Al elegirse, el texto se pasa a trazos. -->
  <defs>
    <linearGradient id="portal-d-lockup-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3EA"/>
      <stop offset="1" stop-color="#0083C1"/>
    </linearGradient>
  </defs>
  <g font-family="Sora, sans-serif" font-weight="700" font-size="64" fill="#EAF4FA">
    <text x="0" y="81" textLength="96" lengthAdjust="spacingAndGlyphs">gal</text>
    <text x="116" y="81" textLength="173" lengthAdjust="spacingAndGlyphs">velop</text>
  </g>
  <!-- la «i»: asta dibujada y su punto, la baldosa de la familia a escala (rx 30/128) -->
  <rect x="100" y="47" width="10" height="34" rx="2" fill="#EAF4FA"/>
  <rect x="98" y="26" width="14" height="14" rx="3.3" fill="url(#portal-d-lockup-fondo)"/>
</svg>
