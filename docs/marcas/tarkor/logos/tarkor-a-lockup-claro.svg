  <title id="tarkor-a-lockup-claro-t">Tarkor: Los Pilares Rotos, lockup sobre fondo claro</title>
  <!-- a. Lockup para fondo claro (hueso, calima): la misma baldosa de los Pilares Rotos y «TARKOR» en Cinzel en hierro #221c16, el texto de la pieza clara de la biblia (madera 400 no llega a 3:1 sobre hueso) -->
