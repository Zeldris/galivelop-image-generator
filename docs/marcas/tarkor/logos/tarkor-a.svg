<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="tarkor-a-t">
  <title id="tarkor-a-t">Tarkor: Los Pilares Rotos</title>
  <!-- a. Los Pilares Rotos: dos torres de roca desiguales en silueta de hueso, una alta y otra quebrada a media altura, unidas por un puente colgante largo y bajo que sale del flanco de la alta; baldosa de la familia con el degradado de arcilla del Portal -->
  <defs>
    <linearGradient id="tarkor-a-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0703A"/>
      <stop offset="1" stop-color="#8a3b1e"/>
    </linearGradient>
    <clipPath id="tarkor-a-recorte"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tarkor-a-fondo)"/>
  <g clip-path="url(#tarkor-a-recorte)" fill="#f1e4d0">
    <path d="M14 128 L18 22 L27 14 L36 20 L38 128 Z"/>
    <path d="M92 128 L94 74 L102 66 L112 70 L116 128 Z"/>
  </g>
  <path d="M38 50 C52 90 80 94 95 72" fill="none" stroke="#f1e4d0" stroke-width="6" stroke-linecap="round"/>
</svg>
