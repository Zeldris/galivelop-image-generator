<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="galivelop-workflow-b-t">
  <title id="galivelop-workflow-b-t">Galivelop-workflow: relevo</title>
  <!-- b. Relevo: dos trazos curvos, uno que llega y otro que sale, se solapan y se pasan un testigo corto en ámbar. -->
  <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- el relevo que llega, desde abajo a la izquierda -->
    <path d="M10 92 C 30 92, 38 56, 54 54" stroke="#3D6FD9"/>
    <!-- el relevo que sale, hacia arriba a la derecha -->
    <path d="M74 74 C 90 72, 98 36, 118 36" stroke="#3D6FD9"/>
    <!-- el testigo -->
    <path d="M64 46 V82" stroke="#f2b34a"/>
  </g>
</svg>
