<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="galivelop-workflow-b-t">
  <title id="galivelop-workflow-b-t">Galivelop-workflow: monograma GW</title>
  <!-- b. Monograma «GW» con el formato del símbolo de Galivelop (portal-a): la misma «G» de un solo trazo blanco de 12 con remates redondos, seguida de una «W», en la baldosa rx 30 con degradado del acento #3D6FD9 → #1E3E99. -->
  <defs>
    <linearGradient id="galivelop-workflow-b-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D6FD9"/>
      <stop offset="1" stop-color="#1E3E99"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-workflow-b-fondo)"/>
  <path d="M46 64 H62 A24 24 0 1 1 38 40 H64 L76 88 L88 60 L100 88 L112 40"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
