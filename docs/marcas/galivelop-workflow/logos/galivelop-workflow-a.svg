<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="galivelop-workflow-a-t">
  <title id="galivelop-workflow-a-t">Galivelop-workflow: monograma gw</title>
  <!-- a. Monograma «gw» de un solo grosor en la baldosa de la familia, degradado #3D6FD9 → #0d1b2a. -->
  <defs>
    <linearGradient id="galivelop-workflow-a-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D6FD9"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-workflow-a-fondo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- g: panza, asta y gancho del descendente -->
    <circle cx="36" cy="56" r="13"/>
    <path d="M49 43 V72 A13 13 0 0 1 23 72"/>
    <!-- w -->
    <path d="M65 43 L75 71 L85 53 L95 71 L105 43"/>
  </g>
</svg>
