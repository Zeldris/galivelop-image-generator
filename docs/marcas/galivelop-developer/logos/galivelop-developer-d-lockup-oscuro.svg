<svg data-fondo="oscuro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 128" role="img" aria-labelledby="galivelop-developer-d-lockup-oscuro-t">
  <title id="galivelop-developer-d-lockup-oscuro-t">galivelop-developer, propuesta d, lockup sobre fondo oscuro</title>
  <!-- Lockup de la propuesta d para fondo oscuro: la misma baldosa «gd» y el nombre en Sora 700 en el acento #2BB3A3 (el #157D74 del lockup base es el color sobre claro, sección 3 de la biblia). -->
  <defs>
    <linearGradient id="galivelop-developer-d-lockup-oscuro-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3A3"/>
      <stop offset="1" stop-color="#157D74"/>
    </linearGradient>
  </defs>
  <svg x="0" y="0" width="128" height="128" viewBox="0 0 128 128">
    <!-- d. Monograma «gd» en la baldosa: la «d» cierra su panza en un anillo de revisión, más grande que la de la «g». -->
    <rect width="128" height="128" rx="30" fill="url(#galivelop-developer-d-lockup-oscuro-fondo)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <!-- g -->
      <circle cx="41" cy="68" r="13"/>
      <path d="M54 55 V84 A13 13 0 0 1 28 84"/>
      <!-- d: el anillo y el asta -->
      <circle cx="86" cy="66" r="15"/>
      <path d="M101 28 V81"/>
    </g>
  </svg>
  <text x="156" y="82" font-family="Sora, sans-serif" font-weight="700" font-size="52" letter-spacing="-1.5" fill="#2BB3A3">galivelop-developer</text>
</svg>
