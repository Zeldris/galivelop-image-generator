<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 128" role="img" aria-labelledby="galivelop-voice-generator-c-lockup-t">
  <title id="galivelop-voice-generator-c-lockup-t">galivelop-voice-generator: huella de anillos (lockup)</title>
  <!-- Lockup: el símbolo «huella de anillos» a la izquierda y el nombre en Sora 700 a la derecha, en el acento -->
  <!-- símbolo -->
  <defs>
    <linearGradient id="galivelop-voice-generator-c-lockup-fondo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#D9467A"/>
      <stop offset="1" stop-color="#A62E5A"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-voice-generator-c-lockup-fondo)"/>
  <circle cx="64" cy="64" r="8" fill="#FFFFFF"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <!-- anillo interior, r 26, en dos segmentos de 130° -->
    <path d="M75 40.4A26 26 0 0 1 75 87.6"/>
    <path d="M53 87.6A26 26 0 0 1 53 40.4"/>
    <!-- anillo exterior, r 46, en tres segmentos de 90° -->
    <path d="M75.9 19.6A46 46 0 0 1 108.4 75.9"/>
    <path d="M96.5 96.5A46 46 0 0 1 31.5 96.5"/>
    <path d="M19.6 75.9A46 46 0 0 1 52.1 19.6"/>
  </g>
  <!-- nombre; al elegirse, el texto se pasa a trazos con Sora -->
  <text x="156" y="86" font-family="Sora, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5" fill="#D9467A">galivelop-voice-generator</text>
</svg>
