      <stop offset="0" stop-color="#D9467A"/>
      <stop offset="1" stop-color="#A62E5A"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-voice-generator-a-lockup-fondo)"/>
