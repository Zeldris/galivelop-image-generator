<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="galivelop-image-generator-b-t">
  <title id="galivelop-image-generator-b-t">galivelop-image-generator: rejilla de intentos</title>
  <!-- Baldosa plana #5B34C9, rejilla 2x2 de marcos de esquina viva (tres huecos, una celda encendida y rellena) -->
  <rect width="128" height="128" rx="28" fill="#5B34C9"/>
  <g fill="none" stroke="#fbfcfd" stroke-width="12" stroke-linecap="round" stroke-linejoin="miter">
    <rect x="22" y="22" width="30" height="30"/>
    <rect x="22" y="76" width="30" height="30"/>
    <rect x="76" y="76" width="30" height="30"/>
  </g>
  <!-- la celda elegida -->
  <rect x="70" y="16" width="42" height="42" fill="#fbfcfd"/>
</svg>
