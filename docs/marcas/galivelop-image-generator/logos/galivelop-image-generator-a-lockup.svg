<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 128" role="img" aria-labelledby="galivelop-image-generator-a-lockup-t">
  <title id="galivelop-image-generator-a-lockup-t">galivelop-image-generator: la cola (lockup)</title>
  <!-- Lockup: el símbolo «la cola» a la izquierda y el nombre en Sora 700 a la derecha, en el acento -->
  <!-- símbolo -->
  <defs>
    <linearGradient id="galivelop-image-generator-a-lockup-fondo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B34C9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-image-generator-a-lockup-fondo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round">
    <!-- marcos de atrás, vacíos -->
    <rect x="62" y="22" width="42" height="42" rx="9"/>
    <rect x="42" y="42" width="42" height="42" rx="9"/>
  </g>
  <!-- hueco que separa la elegida del marco de detrás -->
  <rect x="15" y="55" width="56" height="56" rx="14" fill="url(#galivelop-image-generator-a-lockup-fondo)"/>
  <!-- la elegida, encendida -->
  <rect x="22" y="62" width="42" height="42" rx="9" fill="#FFFFFF"/>
  <!-- nombre; al elegirse, el texto se pasa a trazos con Sora -->
  <text x="156" y="86" font-family="Sora, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5" fill="#8B5CF6">galivelop-image-generator</text>
</svg>
