<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Galivelop IG</title>
  <link rel="icon" href="/ui/assets/gvig.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/css/tokens.css">
  <link rel="stylesheet" href="/ui/css/base.css">
  <link rel="stylesheet" href="/ui/css/layout.css">
  <link rel="stylesheet" href="/ui/css/components.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="ui.nav.skip">Saltar al contenido</a>

  <header class="app-header">
    <a class="brand" href="#/" data-i18n-aria-label="ui.nav.projects">
      <img src="/ui/assets/gvig.svg" alt="" width="28" height="28">
      <span>Galivelop <span class="sigla">IG</span></span>
    </a>
    <nav class="crumbs" id="crumbs" data-i18n-aria-label="ui.nav.crumbs"></nav>
    <div class="header-tools">
      <div id="queue-pill"></div>
      <button type="button" class="btn btn-icon" id="settings-btn" popovertarget="settings" data-i18n-aria-label="ui.settings.title">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
      <button type="button" class="btn btn-icon" id="help" data-i18n-aria-label="ui.shortcuts.title" aria-haspopup="dialog">?</button>
    </div>
    <div id="settings" class="settings-menu" popover role="group" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="ui.settings.title">Ajustes</h2>
      <label for="lang" data-i18n="ui.lang.label">Idioma</label>
      <select id="lang" class="select-inline">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
      <label for="theme" data-i18n="ui.theme.label">Tema</label>
      <select id="theme" class="select-inline">
        <option value="auto" data-i18n="ui.theme.auto">Automático</option>
        <option value="dark" data-i18n="ui.theme.dark">Oscuro</option>
        <option value="light" data-i18n="ui.theme.light">Claro</option>
      </select>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>
  <aside id="queue-drawer" class="queue-drawer" role="dialog" aria-modal="true" aria-labelledby="queue-title" hidden></aside>

  <main id="main" class="app-main" tabindex="-1"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="alerts" class="sr-only" role="alert" aria-live="assertive"></div>

  <dialog id="lightbox" class="lightbox" data-i18n-aria-label="ui.lightbox.label">
    <img id="lightbox-img" alt="">
    <div class="bar"><span id="lightbox-caption"></span><button type="button" class="btn" id="lightbox-close" data-i18n="ui.actions.close">Cerrar</button></div>
  </dialog>

  <dialog id="shortcuts" class="shortcuts" data-i18n-aria-label="ui.shortcuts.title">
    <h2 data-i18n="ui.shortcuts.title">Atajos de teclado y mando</h2>
    <div id="shortcuts-body"></div>
    <p class="row" id="shortcuts-foot"><button type="button" class="btn" id="shortcuts-close" data-i18n="ui.actions.close">Cerrar</button></p>
  </dialog>

  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
