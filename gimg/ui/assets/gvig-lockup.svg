<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 128" role="img" aria-labelledby="galivelop-image-generator-b-lockup-t">
  <title id="galivelop-image-generator-b-lockup-t">galivelop-image-generator: rejilla de intentos (lockup)</title>
  <!-- Lockup: el símbolo «rejilla de intentos» a la izquierda y el nombre en Sora 700 a la derecha, en el acento -->
  <!-- símbolo -->
  <defs>
    <linearGradient id="galivelop-image-generator-b-lockup-fondo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B34C9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#galivelop-image-generator-b-lockup-fondo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="24" y="24" width="80" height="80" rx="16"/>
    <path d="M64 30V98M30 64H98"/>
  </g>
  <!-- la celda elegida -->
  <rect x="75" y="35" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <!-- nombre; al elegirse, el texto se pasa a trazos con Sora -->
  <text x="156" y="86" font-family="Sora, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5" fill="#8B5CF6">galivelop-image-generator</text>
</svg>
